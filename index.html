<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facility Reservation System — Sign In</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-mark">FR</span>
      <div>
        <h1>Facility Reservation</h1>
        <p class="brand-sub">Role-Based Reservation &amp; Approval System</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn" data-tab="signup">Create Account</button>
    </div>

    <form id="login-form" class="tab-panel active">
      <label>Email
        <input type="email" id="login-email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn-primary">Sign In</button>
      <p class="form-msg" id="login-msg"></p>
    </form>

    <form id="signup-form" class="tab-panel">
      <label>Full Name
        <input type="text" id="signup-name" required />
      </label>
      <label>Email
        <input type="email" id="signup-email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
      </label>
      <label>Role
        <select id="signup-role">
          <option value="requester">Requester</option>
          <option value="staff">Facility Staff</option>
          <option value="admin">Administrator</option>
        </select>
      </label>
      <p class="hint">Role selection here is for testing/demo convenience — in production, roles are usually assigned by an admin, not self-selected.</p>
      <button type="submit" class="btn-primary">Create Account</button>
      <p class="form-msg" id="signup-msg"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
